[project]
name = "bene"
version = "0.0.1"
description = "Bene — LLM agent runtime with persistent cross-run skill graph. Substrate for agentdex agent-battle composition."
readme = "README.md"
authors = [{ name = "Eddie Tang" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []  # populated incrementally as Phase 2 implementation lands

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bene"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
