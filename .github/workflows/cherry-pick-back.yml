# yamllint disable rule:truthy
# cherry-pick-back: when a fix lands on main, replay it on dev so the
# integration trunk does not diverge.
#
# Plan: .factory/specs/bene-cicd-redesign-tiered.md (Stage C-5)

name: cherry-pick-back

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: cherry-pick-back-${{ github.sha }}
  cancel-in-progress: false

jobs:
  pick:
    name: cherry-pick to dev
    runs-on: eng-github-runners
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release): nightly dev->main') }}"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure gh CLI (fallback runners in the group lack it)
        run: |
          command -v gh >/dev/null 2>&1 && exit 0
          url="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest \
            | grep -oE '"browser_download_url": *"[^"]*linux_amd64\.tar\.gz"' \
            | head -1 | cut -d'"' -f4)"
          curl -fsSL "$url" -o "$RUNNER_TEMP/gh.tgz"
          tar -xzf "$RUNNER_TEMP/gh.tgz" -C "$RUNNER_TEMP"
          dir="$(dirname "$(find "$RUNNER_TEMP" -type f -name gh -path '*/bin/*' | head -1)")"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Configure git identity
        run: |
          git config user.name "bene-bot"
          git config user.email "bene-bot@users.noreply.github.com"
      - name: Cherry-pick onto dev
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          short="$(git rev-parse --short=12 "${sha}")"
          branch="bot/cherry-pick-${short}"
          git fetch origin dev
          git checkout -b "${branch}" origin/dev
          if git cherry-pick --allow-empty -x "${sha}"; then
            echo "ok=true" >> "${GITHUB_OUTPUT}"
            echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
            echo "short=${short}" >> "${GITHUB_OUTPUT}"
          else
            git cherry-pick --abort || true
            echo "ok=false" >> "${GITHUB_OUTPUT}"
            echo "short=${short}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Push and open PR (clean cherry-pick)
        if: steps.pick.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git push origin "${{ steps.pick.outputs.branch }}"
          # The org currently blocks GITHUB_TOKEN from creating PRs
          # ("GitHub Actions is not permitted to create or approve pull
          # requests"). dev is an unprotected replay trunk carrying only
          # main commits, so on policy denial fall back to pushing the
          # pick directly — the PR path resumes the moment the org
          # toggle is flipped.
          gh_err="$(mktemp)"
          if gh pr create \
            --base dev \
            --head "${{ steps.pick.outputs.branch }}" \
            --title "chore: cherry-pick ${{ steps.pick.outputs.short }} to dev" \
            --body "Auto-replay of main commit ${{ github.sha }} onto dev to keep integration trunk in sync." \
            2> "${gh_err}"
          then
            :
          # Classify before falling back (review High/Major/P2, #177
          # follow-up): only the documented org-policy denial may take the
          # direct-push path. Transient API/network/auth errors keep the
          # bot branch and fail the job for a visible retry.
          elif ! grep -qi "not permitted to create or approve pull requests" "${gh_err}"; then
            cat "${gh_err}" >&2
            echo "::error::gh pr create failed for a non-policy reason —" \
              "keeping ${{ steps.pick.outputs.branch }} for retry"
            exit 1
          else
            echo "::warning::PR creation denied by org policy — fast-forwarding dev directly"
            # Race-safe replay (review P1, #177 follow-up): push the MAIN
            # SHA itself, not the pick. While the PR path is policy-blocked
            # dev is a pure main mirror, so this is a fast-forward that
            # also self-heals any commit a skipped/raced run missed (FF
            # carries all ancestors). If a concurrent job already advanced
            # dev past us, the ancestor check converges instead of failing;
            # a dev that genuinely diverged (PR-path merges resumed) fails
            # LOUDLY for manual reconcile rather than silently rewriting.
            if ! git push origin "${{ github.sha }}:refs/heads/dev"; then
              git fetch origin dev
              lease="$(git rev-parse origin/dev)"
              if git merge-base --is-ancestor "${{ github.sha }}" origin/dev; then
                echo "dev already contains ${{ github.sha }} (concurrent replay won) — converged"
              elif [ -z "$(git cherry origin/main origin/dev | grep '^+' || true)" ]; then
                # Review P1 (#179): every dev-only commit is patch-equivalent
                # to a main commit (old HEAD:dev pick fallback, or squash-
                # merged pick PRs) — dev is still the replay line, just on
                # different SHAs. Migrate it onto main's history; the lease
                # pins the tip we inspected so a concurrent update aborts.
                echo "::warning::dev is a patch-equivalent replay on divergent SHAs — migrating to main lineage"
                git push --force-with-lease="refs/heads/dev:${lease}" \
                  origin "${{ github.sha }}:refs/heads/dev"
              else
                echo "::error::dev has commits not patch-equivalent to main — reconcile manually"
                exit 1
              fi
            fi
            git push origin --delete "${{ steps.pick.outputs.branch }}" || true
          fi
      - name: File issue on conflict
        if: steps.pick.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          SHORT: ${{ steps.pick.outputs.short }}
        run: |
          set -euo pipefail
          # Review P1 (#179): in the overlapping-push race a LATER main
          # commit can fail its preliminary cherry-pick against a STALE dev
          # tip (it depends on the earlier commit not yet replayed) even
          # though directly advancing dev to this SHA is a plain fast-
          # forward carrying both. Attempt that recovery before declaring
          # a conflict; if dev is not an ancestor of this SHA (genuine
          # divergence, e.g. PR-path merges), fall through to the issue.
          git fetch origin dev
          if git merge-base --is-ancestor origin/dev "${SHA}"; then
            if git push origin "${SHA}:refs/heads/dev"; then
              echo "stale-tip race recovered by fast-forward — no real conflict, skipping issue"
              exit 0
            fi
          fi
          body_file="$(mktemp)"
          {
            echo "Commit ${SHA} on main does not cleanly cherry-pick onto dev."
            echo
            echo "Please resolve manually:"
            echo '```'
            echo "git fetch origin"
            echo "git checkout -b cherry-pick-${SHORT} origin/dev"
            echo "git cherry-pick -x ${SHA}"
            echo "# resolve conflicts, push, open PR to dev"
            echo '```'
          } > "${body_file}"
          gh issue create \
            --title "cherry-pick conflict: ${SHORT} -> dev" \
            --label "cherry-pick-conflict" \
            --body-file "${body_file}"
