# yamllint disable rule:truthy
# Stage E: post-merge ratchet of .coverage-floor on push to main.
#
# Contract (.factory/specs/bene-cicd-redesign-tiered.md):
#   - measure coverage on green main HEAD
#   - bump .coverage-floor by at most MAX_BUMP=5 percentage points per push
#   - cap at CEILING=98
#   - never lower the floor (regression detection lives in Gate-1/2)
#   - skip if commit message contains [skip-ratchet] or [skip ci]

name: push-main

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ratchet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ratchet:
    name: ci/ratchet-coverage
    if: >-
      ${{ !contains(github.event.head_commit.message, '[skip-ratchet]')
       && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: eng-github-runners
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.7"
          enable-cache: true
          # Shared self-hosted uv cache: never prune from CI (see ci.yml note).
          prune-cache: false
          python-version: "3.12"

      - name: Install dev dependencies
        run: uv sync --dev --group temporal

      - name: Ensure gh CLI (fallback runners in the group lack it)
        run: |
          command -v gh >/dev/null 2>&1 && exit 0
          url="$(curl -fsSL https://api.github.com/repos/cli/cli/releases/latest \
            | grep -oE '"browser_download_url": *"[^"]*linux_amd64\.tar\.gz"' \
            | head -1 | cut -d'"' -f4)"
          curl -fsSL "$url" -o "$RUNNER_TEMP/gh.tgz"
          tar -xzf "$RUNNER_TEMP/gh.tgz" -C "$RUNNER_TEMP"
          dir="$(dirname "$(find "$RUNNER_TEMP" -type f -name gh -path '*/bin/*' | head -1)")"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Measure coverage
        run: |
          uv run pytest -q \
            --cov=bene --cov-report=xml --cov-report=term \
            tests/

      - name: Ratchet floor
        id: ratchet
        run: |
          before="$(cat .coverage-floor)"
          bash scripts/ci/ratchet_coverage.sh | tee ratchet.out
          after="$(cat .coverage-floor)"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after"   >> "$GITHUB_OUTPUT"
          echo "changed=$([[ "$before" != "$after" ]] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Open ratchet PR if changed
        if: steps.ratchet.outputs.changed == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Direct `git push origin HEAD:main` is rejected with GH013 by the
        # branch ruleset (GITHUB_TOKEN has no bypass), which kept this job
        # red on every floor bump since the ruleset landed. Land the bump
        # via a PR instead. Caveat: PRs opened with GITHUB_TOKEN do not
        # trigger CI workflows, so required checks will not start on their
        # own — auto-merge is requested best-effort and the PR may need a
        # human nudge (close/reopen re-triggers CI, or merge manually).
        # Swapping GH_TOKEN for a PAT/app token makes this fully automatic.
        run: |
          set -euo pipefail
          git config user.name  "bene-ratchet[bot]"
          git config user.email "bene-ratchet@users.noreply.github.com"
          before="${{ steps.ratchet.outputs.before }}"
          after="${{ steps.ratchet.outputs.after }}"
          # STABLE branch name + force-push = idempotent across job reruns,
          # partial failures (branch pushed but PR create errored), and
          # unrelated main merges while a ratchet PR is still pending —
          # there is only ever one ratchet branch and at most one open PR.
          branch="bot/ratchet-floor"
          git checkout -B "${branch}"
          git add .coverage-floor
          # [skip-ratchet] must survive into the squash-merge commit message
          # (= PR title), so the post-merge push-main run skips instead of
          # cascading another bump PR while the floor catches up.
          title="ci: ratchet coverage floor ${before} -> ${after} [skip-ratchet]"
          git commit -m "${title}"
          git push -f origin "${branch}"
          body="Auto-ratchet from green main HEAD ${GITHUB_SHA}."
          body="${body} One-line .coverage-floor bump; see push-main.yml"
          body="${body} for the PR-based flow rationale."
          existing="$(gh pr list --head "${branch}" --base main --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" --body "${body}"
          else
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "${title}" \
              --body "${body}"
          fi
          gh pr merge --auto --squash "${branch}" \
            || echo "auto-merge unavailable; ratchet PR awaits a manual nudge"

      - name: Summary
        run: |
          {
            echo "### Coverage ratchet"
            echo ""
            echo "- before: \`${{ steps.ratchet.outputs.before }}\`"
            echo "- after:  \`${{ steps.ratchet.outputs.after }}\`"
            echo "- changed: \`${{ steps.ratchet.outputs.changed }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
