# yamllint disable rule:truthy
# Entry point: push to dev -> strict-gate snapshot (advisory dashboard signal).
#
# This is dev's quality heartbeat between feature merges. It is NOT a
# branch protection check; it informs the nightly-promote bot whether
# dev is currently safe to roll into main.

name: push-dev

on:
  push:
    branches: [dev]
  # Pushes made with GITHUB_TOKEN (cherry-pick-back's policy-denial
  # fallback, manual dev syncs) never fire the push trigger, leaving the
  # dev tip without the ci/strict check nightly-promote requires.
  # workflow_dispatch lets the reconciler (and humans) attach it on demand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  strict-snapshot:
    uses: ./.github/workflows/reusable-strict-gate.yml
    secrets: inherit
