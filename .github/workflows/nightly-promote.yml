# yamllint disable rule:truthy
# nightly-promote: open a dev -> main PR on workdays 6pm PT.
#
# Oppie Spinnaker parallel: Manual Judgement / quiesce. The PR is opened
# automatically only if dev is currently green (latest push-dev run on
# dev's HEAD succeeded). The merge itself REQUIRES human approve.
#
# Plan: .factory/specs/bene-cicd-redesign-tiered.md (Stage C-4)

name: nightly-promote

on:
  schedule:
    # 18:00 PT = 02:00 UTC (PST) / 01:00 UTC (PDT). Use 02:00 UTC; if PT is
    # PDT then this fires at 19:00 PT instead, which is still off-peak.
    - cron: "0 2 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Required by the missing-check reconciler's `gh workflow run` dispatch
  # (review High/P1, #180).
  actions: write

concurrency:
  group: nightly-promote
  cancel-in-progress: false

jobs:
  open-promote-pr:
    name: open dev -> main promotion PR
    runs-on: eng-github-runners
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify dev is currently green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dev_sha="$(git rev-parse origin/dev)"
          # Conclusions + leg count in one probe. The count floor guards the
          # partial-presence window (review Major, #180): one finished leg
          # with the rest not yet created must not read as green — the
          # strict gate fans out 6 legs, so require at least 5. Reusable
          # workflow check names are prefixed by the caller job (for example
          # "strict-snapshot / ci/strict/fast"), so match ci/strict anywhere
          # on a path boundary. Push snapshots skip the PR-only regression leg;
          # skipped legs count as present but not as a non-green conclusion.
          strict_probe() {
            gh api "repos/${GITHUB_REPOSITORY}/commits/${dev_sha}/check-runs" \
              --jq '[.check_runs[] | select(.name | test("(^| / )ci/strict/"))]
                    | {c: ([.[] | select(.conclusion != "skipped") | .conclusion] | unique), n: length}'
          }
          probe="$(strict_probe)"
          status="$(echo "${probe}" | jq -c .c)"
          legs="$(echo "${probe}" | jq -r .n)"
          echo "dev ci/strict conclusions: ${status} (legs: ${legs})"
          # Reconciler (review P1, #177 follow-up): dev tips pushed with
          # GITHUB_TOKEN (cherry-pick-back policy fallback, manual syncs)
          # never trigger push-dev, so the ci/strict check is MISSING —
          # not failed. Dispatch push-dev for the tip and wait bounded;
          # any terminal non-success ends the wait early.
          if [ "${status}" = "[]" ]; then
            echo "::warning::no ci/strict check on dev tip — dispatching push-dev and waiting"
            gh workflow run push-dev.yml --ref dev
            for _ in $(seq 1 30); do
              sleep 60
              probe="$(strict_probe)"
              status="$(echo "${probe}" | jq -c .c)"
              legs="$(echo "${probe}" | jq -r .n)"
              case "${status}" in
                '["success"]')
                  # A lone early leg reads success before its siblings are
                  # even created (review Major, #180) — keep waiting until
                  # the full fan-out is present.
                  [ "${legs}" -ge 5 ] && break ;;
                *failure*|*cancelled*|*timed_out*|*action_required*) break ;;
              esac
            done
            echo "post-dispatch dev ci/strict conclusions: ${status} (legs: ${legs})"
            # Revalidate the tip after the wait (review High/P1, #180): if
            # dev advanced while we reconciled, the polled verdict belongs
            # to a stale commit — abort this cycle, next nightly retries.
            git fetch origin dev
            if [ "$(git rev-parse origin/dev)" != "${dev_sha}" ]; then
              echo "::error title=dev moved during reconcile::abort promotion; next nightly retries"
              exit 1
            fi
          fi
          if [ "${status}" = '["success"]' ] && [ "${legs}" -ge 5 ]; then
            echo "dev is green (${legs} strict legs); proceeding"
          else
            echo "::error title=dev not green::abort promotion (${status}, legs: ${legs})"
            exit 1
          fi
      - name: Skip if a promotion PR is already open
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing="$(gh pr list --base main --head dev --state open --json number --jq 'length')"
          if [ "${existing}" != "0" ]; then
            echo "::notice title=Existing promotion PR open::skipping"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Open dev -> main PR (manual judgement required)
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          body_file="$(mktemp)"
          {
            echo "Automated promotion PR. dev is green."
            echo
            echo "This PR requires human approve (Manual Judgement / quiesce)."
            echo "SLA: 24h. Escalate to @good-night-oppie/bene-maintainers if untouched."
          } > "${body_file}"
          gh pr create \
            --base main \
            --head dev \
            --title "chore(release): nightly dev->main ${today}" \
            --body-file "${body_file}"
